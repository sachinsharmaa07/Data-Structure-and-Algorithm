name: Sync LeetCode Progress

on:
  schedule:
    # Every 6 hours at minute 17 (UTC): avoids the top of the hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-progress-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch recent accepted LeetCode submissions
        env:
          LEETCODE_USERNAME: sachinsharmaa07
        run: python scripts/leetcode_sync.py

      - name: Commit progress changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md progress.md leetcode_progress.json
            git commit -m "chore: sync LeetCode progress"
            git pull --rebase --autostash
            git push
          else
            echo "No progress changes to commit."
          fi
